[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fruitfly-desktop"
version = "0.1.0"
description = "Experimental low-duty-cycle neural desktop pet for Hyprland"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7"]

[tool.setuptools.packages.find]
where = ["src"]

